services:
  postgres:
    image: postgres:16-alpine
    container_name: trellis_db
    environment:
      POSTGRES_USER: trellis
      POSTGRES_PASSWORD: trellis
      POSTGRES_DB: trellis_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trellis']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
